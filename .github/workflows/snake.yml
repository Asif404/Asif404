name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=8B5CF6&color_dots=0D1117,3730A3,6366F1,8B5CF6,06B6D4&color_background=ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=8B5CF6&color_dots=0D1117,3730A3,6366F1,8B5CF6,06B6D4&color_background=0D1117

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
