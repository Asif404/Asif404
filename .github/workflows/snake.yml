name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2306B6D4&color_dots=%23ebedf0,%233730A3,%236366F1,%238B5CF6,%2306B6D4&color_background=%23ffffff
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2306B6D4&color_dots=%23161B22,%233730A3,%236366F1,%238B5CF6,%2306B6D4&color_background=%230D1117

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
