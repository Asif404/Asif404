name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Asif404&show_icons=true&theme=react&hide_border=true&bg_color=0D1117&title_color=8B5CF6&icon_color=06B6D4&count_private=true&include_all_commits=true
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate streak stats card
        uses: muhammad-fiaz/github-readme-streak-stats@v1.0.1
        with:
          USERNAME: Asif404
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          THEME: dark
          BACKGROUND: "0D1117"
          STROKE: "0D1117"
          RING: "8B5CF6"
          FIRE: "06B6D4"
          CURR_STREAK_NUM: "ffffff"
          SIDE_NUMS: "ffffff"
          CURR_STREAK_LABEL: "8B5CF6"
          DATES: "9ca3af"
          HIDE_BORDER: "true"
          CARD_WIDTH: "480"
          CARD_HEIGHT: "180"
          OUTPUT_PATH: profile/streak-stats.svg

      - name: Add explicit dimensions to streak card
        run: |
          sed -i "s/viewBox='0 0 480 180'/width='480' height='180' viewBox='0 0 480 180'/" profile/streak-stats.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
